<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Match Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1EC; --card:#FFFFFF; --ink:#14213D; --muted:#566074; --line:#CFD7CD; --soft:#E2E8E0;
  --pitch:#2E7A4B; --pitch2:#2A7045; --bib:#F2C230; --bib-ink:#14213D; --red:#C8322D; --go:#1F7A45;
  --font:'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101B15; --card:#18261E; --ink:#E8EEE6; --muted:#9AA79E; --line:#2C3D33; --soft:#20322A;
    --pitch:#26653F; --pitch2:#225C39; --red:#E3574F; --go:#3FA66B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101B15; --card:#18261E; --ink:#E8EEE6; --muted:#9AA79E; --line:#2C3D33; --soft:#20322A;
  --pitch:#26653F; --pitch2:#225C39; --red:#E3574F; --go:#3FA66B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bib);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:baseline;gap:12px}
.top h1{margin:0;font-size:24px;font-weight:800;font-stretch:78%;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:15px;margin-left:auto;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub b{color:var(--ink);font-stretch:75%;font-size:20px}

main{max-width:760px;margin:0 auto;padding:8px 14px 110px}
section{display:none}
section.on{display:block}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{min-height:62px;border:none;background:none;font-size:15px;padding:0 2px;font-weight:700;font-stretch:85%;color:var(--muted);border-top:4px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-top-color:var(--bib)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
h2{margin:0 0 4px;font-size:22px;font-weight:800;font-stretch:80%}
h3{margin:14px 0 8px;font-size:18px;font-weight:800;font-stretch:85%}
.lead{margin:0 0 12px;color:var(--muted);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2:not(.tight){grid-template-columns:1fr}}
.grid2.tight{margin:4px 0 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pair .btn{min-height:56px;font-size:18px;padding:0 8px}
.field label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:4px}

.in{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px;font-size:17px}
.in:focus{border-color:var(--ink);outline:none}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}

.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;font-size:17px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.go{background:var(--go);border-color:var(--go);color:#fff}
.btn.stop{background:var(--red);border-color:var(--red);color:#fff}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.small{min-height:42px;font-size:15px;padding:0 13px}
.btn.big{min-height:60px;font-size:20px;flex:1}
.btn:disabled{opacity:.4}
.icon{min-width:44px;min-height:44px;border:none;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:10px;font-size:15px;font-weight:600}
.icon:hover{background:var(--soft)}
.dl-only{display:none}
body.dl-on .dl-only{display:inline-block}

/* squad */
.srow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.avail{flex:1;display:flex;align-items:center;gap:14px;background:none;border:none;text-align:left;min-height:60px;cursor:pointer;padding:0}
.tick{width:32px;height:32px;flex:none;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.in .tick,.srow.in .tick,.job.done .tick{background:var(--go);border-color:var(--go)}
.num{width:30px;text-align:right;font-weight:800;font-stretch:72%;font-size:20px;color:var(--muted)}
.pname{font-size:19px;font-weight:700}
.srow.out .pname{color:var(--muted);text-decoration:line-through;font-weight:500}
.srow.edit{gap:8px;padding:8px 0;flex-wrap:wrap}
.srow.edit .in{flex:1;min-width:120px}
.srow.edit .num-in{flex:0 0 70px;min-width:0}
.count{font-weight:800;font-stretch:78%;font-size:20px}

/* plan */
.parts{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px}
.part{flex:none;min-width:94px;min-height:60px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);text-align:left;padding:6px 12px;cursor:pointer}
.part b{display:block;font-size:17px;font-stretch:85%}
.part small{color:var(--muted);font-size:14px}
.part.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.part.on small{color:inherit;opacity:.8}
.part.add{border-style:dashed;color:var(--muted);font-weight:700;display:grid;place-items:center}
.hint{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:16px}
.hint.sel{background:var(--bib);color:var(--bib-ink);font-weight:600}
.warn-line{color:var(--red);font-weight:600;font-size:15px;margin:6px 0}

.pitch-wrap{display:flex;flex-direction:column;align-items:center}
.pitch{position:relative;width:min(100%,calc(68vh * .68));aspect-ratio:68/100;border-radius:12px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch) 0 10%,var(--pitch2) 10% 20%)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pitch.compact{width:min(100%,calc(52vh * .68))}
.attack{font-size:13px;color:var(--muted);margin:4px 0 0}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:0;width:78px;cursor:pointer;z-index:2}
div.slot{cursor:default}
.slot .disc{width:54px;height:54px;border-radius:50%;background:var(--bib);color:var(--bib-ink);display:grid;place-items:center;font-weight:800;font-stretch:72%;font-size:20px;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.slot.empty .disc{background:rgba(255,255,255,.12);border:2.5px dashed rgba(255,255,255,.9);color:#fff;font-size:15px;box-shadow:none}
.slot .nm{background:rgba(8,18,12,.8);color:#fff;font-weight:700;font-size:14px;font-stretch:78%;padding:1px 7px;border-radius:5px;max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.sel .disc{box-shadow:0 0 0 4px var(--red),0 0 0 7px #fff}
.slot.bad .disc{background:#fff;color:var(--red);border-color:var(--red)}
.compact .slot{width:66px}
.compact .slot .disc{width:42px;height:42px;font-size:16px;border-width:2px}
.compact .slot .nm{font-size:12.5px;max-width:66px}

.bench{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:6px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip .n{font-stretch:72%;color:var(--muted);font-weight:800}
.chip.sel{background:var(--red);border-color:var(--red);color:#fff}
.chip.sel .n{color:#fff}
.chip.ghost{font-weight:500;font-size:15px;min-height:40px;color:var(--muted)}

.changes{list-style:none;padding:0;margin:6px 0 0}
.changes li{padding:9px 0;border-bottom:1px solid var(--line);font-size:17px}
.changes li:last-child{border-bottom:none}
.changes .k{display:inline-block;min-width:54px;font-size:13px;font-weight:700;color:var(--muted)}
.none{color:var(--muted);font-size:15px;margin:6px 0}

.mrow{display:grid;grid-template-columns:minmax(90px,130px) 1fr 44px;gap:10px;align-items:center;padding:5px 0}
.mrow .bar{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.mrow .bar i{display:block;height:100%;background:var(--go);border-radius:7px}
.mrow .m{text-align:right;font-weight:800;font-stretch:75%;font-variant-numeric:tabular-nums}
.mrow.zero{color:var(--red)}

/* jobs */
.job{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:none}
.job .tick-btn{background:none;border:none;padding:4px;cursor:pointer}
.job .jt{flex:1;font-size:18px;padding-top:6px}
.job.done .jt>div:first-child{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:14px;font-weight:700;background:var(--bib);color:var(--bib-ink);border-radius:6px;padding:1px 8px}
.tag.plain{background:var(--soft);color:var(--muted);font-weight:600}

/* match */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:6px}
.score .who{font-size:16px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score .n{font-size:64px;font-weight:800;font-stretch:70%;line-height:1}
.score .dash{font-size:40px;color:var(--muted)}
.clockbox{text-align:center}
.phase{font-size:17px;font-weight:700;color:var(--muted)}
.clock{font-size:clamp(72px,22vw,120px);font-weight:800;font-stretch:66%;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:4px 0 12px}
.clock.paused{color:var(--muted)}
.due{border:3px solid var(--red)}
.due-title{color:var(--red)}
.cd{font-weight:800;font-stretch:75%;font-size:22px;font-variant-numeric:tabular-nums}
.ev{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.ev:last-child{border-bottom:none}
.ev .t{font-weight:800;font-stretch:75%;min-width:52px;font-variant-numeric:tabular-nums;color:var(--muted)}
.ev .x{flex:1}
.ev.goal .x{font-weight:700;color:var(--go)}
.ev.opp .x{font-weight:700;color:var(--red)}
.ev.phase .x{font-weight:700}

/* shape editor */
.slot.shape{cursor:grab;touch-action:none}
.slot.shape .disc{background:#fff;color:var(--ink);border-color:var(--bib);font-size:15px}
/* whiteboard */
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin:12px 0 8px}
.seg button{min-height:48px;border:none;border-radius:9px;background:none;font-weight:700;font-size:16px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
.swatches{margin-bottom:10px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer;flex:none}
.sw.on{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.toolhint{font-size:14px;color:var(--muted);flex:1;min-width:140px}
.pitch.board{width:min(100%,calc((100vh - 230px) * .68))}
.pitch svg#bsvg{pointer-events:auto;touch-action:none}
.board .ln{pointer-events:none}
.board .ln .hit{fill:none;stroke:transparent;stroke-width:3.5}
.board.erase .ln{pointer-events:auto}
.board.erase .ln .hit{pointer-events:stroke}
.board.erase .ln path:not(.hit){pointer-events:none}
.board .tok{cursor:grab}
.board text{font-family:var(--font);font-stretch:75%;pointer-events:none}
.board .tn{fill:#fff;stroke:rgba(0,0,0,.8);stroke-width:.7;paint-order:stroke}
.saved{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.saved:last-child{border-bottom:none}
.saved .x{flex:1}
.saved small{color:var(--muted)}
.whenrow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.whenrow .chip{min-height:42px;font-size:15px;padding:4px 12px}
.sheet-sec{font-size:14px;font-weight:700;color:var(--muted);margin:10px 0 6px}
.mrow .plan{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.mrow.act{grid-template-columns:minmax(90px,130px) 1fr 86px}
/* season */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:40px;font-weight:800;font-stretch:70%;line-height:1.05}
.stats span{font-size:14px;color:var(--muted);font-weight:600}
.srow2{display:grid;grid-template-columns:minmax(84px,120px) 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow2:last-child{border-bottom:none}
.srow2 .bar{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.srow2 .bar i{display:block;height:100%;background:var(--go);border-radius:0 4px 4px 0}
.srow2 .v{font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow2 .v b{color:var(--ink);font-size:17px;font-stretch:78%}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{text-align:right;font-size:14px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:none}
.band{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.band:last-child{border-bottom:none}
.band .lbl{font-size:15px;font-weight:600;white-space:nowrap}
.band .bars{display:grid;gap:2px}
.band .b{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.band .b i{display:block;height:12px;border-radius:0 4px 4px 0}
.band .for i{background:var(--go)}
.band .ag i{background:var(--red)}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);margin:0 0 8px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--go)}
.legend span.ag::before{background:var(--red)}
.game{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;cursor:pointer;min-height:56px}
.game:last-child{border-bottom:none}
.game .res{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.game .res.W{background:var(--go)} .game .res.D{background:var(--muted)} .game .res.L{background:var(--red)}
.game .x{flex:1;font-size:17px}
.game .x small{display:block;color:var(--muted);font-size:14px}
.game .sc{font-weight:800;font-stretch:75%;font-size:22px;font-variant-numeric:tabular-nums}
dialog.sheet{border:none;border-radius:16px;padding:18px;width:min(520px,94vw);background:var(--card);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(0,0,0,.5)}
dialog.sheet h3{margin:0 0 12px;font-size:21px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.opts .chip{justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;max-width:92vw;display:none}
.toast.on{display:block}
@media (prefers-reduced-motion: no-preference){ .toast.on{animation:pop .18s ease-out} @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}} }
</style>
</head>
<body>

<header class="top"><div class="top-in"><h1 id="title">Match day</h1><div class="sub" id="sub"></div></div></header>

<main>
  <section id="squad"></section>
  <section id="plan"></section>
  <section id="notes"></section>
  <section id="board"></section>
  <section id="match"></section>
  <section id="season"></section>
</main>

<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button data-act="nav" data-tab="squad">Squad</button>
  <button data-act="nav" data-tab="plan">Plan</button>
  <button data-act="nav" data-tab="notes">Jobs</button>
  <button data-act="nav" data-tab="board">Board</button>
  <button data-act="nav" data-tab="match">Match</button>
  <button data-act="nav" data-tab="season">Season</button>
</div></nav>

<dialog class="sheet" id="sheet"><h3 id="sheetT"></h3><div id="sheetB"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
// ───────── formations (x,y in % of pitch; top = attacking end) ─────────
const B4=[['LB',14,70],['CB',37,75],['CB',63,75],['RB',86,70]];
const B3=[['CB',26,74],['CB',50,77],['CB',74,74]];
const GK=[['GK',50,90]];
const B5=[['LWB',10,64],['CB',30,76],['CB',50,78],['CB',70,76],['RWB',90,64]];
const M4=[['LM',13,52],['CM',37,56],['CM',63,56],['RM',87,52]];
const FORMATIONS={
  11:{
    '4-4-2':[...GK,...B4,['LM',14,46],['CM',37,51],['CM',63,51],['RM',86,46],['ST',37,21],['ST',63,21]],
    '4-3-3':[...GK,...B4,['CM',28,48],['DM',50,56],['CM',72,48],['LW',16,23],['ST',50,17],['RW',84,23]],
    '4-2-3-1':[...GK,...B4,['DM',36,57],['DM',64,57],['LW',15,36],['AM',50,38],['RW',85,36],['ST',50,16]],
    '4-1-4-1':[...GK,...B4,['DM',50,60],['LM',14,40],['CM',37,44],['CM',63,44],['RM',86,40],['ST',50,17]],
    '3-5-2':[...GK,...B3,['LWB',11,48],['CM',31,50],['DM',50,58],['CM',69,50],['RWB',89,48],['ST',37,21],['ST',63,21]],
    '3-4-3':[...GK,...B3,['LM',13,50],['CM',37,54],['CM',63,54],['RM',87,50],['LW',17,24],['ST',50,18],['RW',83,24]],
    '5-3-2':[...GK,...B5,['CM',27,48],['CM',50,53],['CM',73,48],['ST',37,21],['ST',63,21]],
    '4-5-1':[...GK,...B4,['LM',12,42],['CM',32,48],['CM',50,55],['CM',68,48],['RM',88,42],['ST',50,18]],
    '4-4-1-1':[...GK,...B4,['LM',14,48],['CM',37,53],['CM',63,53],['RM',86,48],['SS',50,32],['ST',50,17]],
    '4-3-1-2':[...GK,...B4,['CM',28,52],['DM',50,58],['CM',72,52],['AM',50,38],['ST',37,20],['ST',63,20]],
    '4-3-2-1':[...GK,...B4,['CM',28,52],['CM',50,56],['CM',72,52],['AM',35,33],['AM',65,33],['ST',50,17]],
    '3-4-1-2':[...GK,...B3,...M4,['AM',50,38],['ST',37,20],['ST',63,20]],
    '3-4-2-1':[...GK,...B3,...M4,['AM',34,33],['AM',66,33],['ST',50,17]],
    '5-4-1':[...GK,...B5,['LM',14,46],['CM',37,51],['CM',63,51],['RM',86,46],['ST',50,19]]

function changes(a,b){
  const out=[]; if(!a) return out;
  const sa=slotsOf(a), sb=slotsOf(b);
  const inA=new Set(a.slots.filter(Boolean)), inB=new Set(b.slots.filter(Boolean));
  if(a.formation!==b.formation) out.push({k:'shape',text:`Change shape to ${b.formation}`});
  const offs=[...inA].filter(x=>!inB.has(x)), used=new Set();
  b.slots.forEach((id,i)=>{
    if(!id||inA.has(id)) return;
    let off=a.slots[i];
    if(!(off&&offs.includes(off)&&!used.has(off))) off=offs.find(o=>!used.has(o));
    if(off){used.add(off);out.push({k:'sub',on:id,off,text:`${nm(id)} on for ${nm(off)} (${sb[i][0]})`})}
    else out.push({k:'sub',on:id,text:`${nm(id)} on (${sb[i][0]})`});
  });
  offs.filter(o=>!used.has(o)).forEach(o=>out.push({k:'sub',off:o,text:`${nm(o)} off, no replacement`}));
  b.slots.forEach((id,i)=>{
    if(!id||!inA.has(id)) return;
    const j=a.slots.indexOf(id), pa=sa[j]&&sa[j][0], pb=sb[i][0];
    if(pa&&pa!==pb) out.push({k:'move',text:`${nm(id)} moves from ${pa} to ${pb}`});
  });
  return out;
}
function changeList(ch){
  if(!ch.length) return '<p class="none">No changes from the previous part.</p>';
  const lab={sub:'Sub',move:'Move',shape:'Shape'};
  return `<ul class="changes">${ch.map(c=>`<li><span class="k">${lab[c.k]}</span>${esc(c.text)}</li>`).join('')}</ul>`;
}
function minutes(){
  const m={}; const ps=parts();
  ps.forEach((p,i)=>{const d=partEnd(i)-p.start;p.slots.forEach(id=>{if(id)m[id]=(m[id]||0)+d})});
  return m;
}

function ghPut(c){try{localStorage.setItem(GHKEY,JSON.stringify(c))}catch(e){}}
function b64url(str){return b64encode(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return b64decode(s)}
function ghSetupLink(){const c=ghCfg();return location.href.split('#')[0]+'#mm='+b64url(JSON.stringify({repo:c.repo,branch:c.branch,path:c.path,token:c.token}))}
function ghFromHash(){

function ghStatus(msg){const c=ghCfg();c.last=msg;ghPut(c);const el=$('#ghStatus');if(el)el.textContent=msg}
function b64encode(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64decode(b64){const bin=atob(String(b64).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function ghUrl(c){return `https://api.github.com/repos/${c.repo.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,'')}/contents/${c.path.trim().replace(/^\/+/,'').split('/').map(encodeURIComponent).join('/')}`}
function ghHeaders(c){const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(c.token.trim())h.Authorization='Bearer '+c.token.trim();return h}
function ghErr(status){
  if(status===401)return 'GitHub rejected the token. Check it hasn\'t expired.';
  if(status===403)return 'The token doesn\'t have permission for this repository, or GitHub is rate-limiting. Check the token has Contents: read and write.';
  if(status===404)return 'Repository or file not found. Check the name, branch and file path. A private repository needs a token.';
  if(status===409||status===422)return 'GitHub refused the save because the file changed. Load it first, then save again.';
  return 'GitHub returned an error ('+status+').';
}
async function ghFetchRemote(c){
  const r=await fetch(ghUrl(c)+'?ref='+encodeURIComponent(c.branch.trim()||'main')+'&t='+Date.now(),{headers:ghHeaders(c),cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw {status:r.status};
  return r.json();
}
async function ghLoad(){
  const c=ghCfg(); if(!c.repo.trim()){toast('Enter the repository first.');return}
  ghStatus('Loading from GitHub…');
  try{
    const f=await ghFetchRemote(c);
    if(!f){ghStatus(ghErr(404));return}
    let d; try{d=JSON.parse(b64decode(f.content))}catch(e){ghStatus('That file isn\'t a Match Manager backup.');return}
    if(!d||d.v!==2||!Array.isArray(d.roster)||!Array.isArray(d.strategies)){ghStatus('That file isn\'t a Match Manager backup.');return}
    confirmBox(`Replace everything here with the GitHub copy (${d.roster.length} players, ${d.strategies.length} plan${d.strategies.length===1?'':'s'})?`,'Load',()=>{
      S=normalise(d); ui.partId=null; ui.sel=null; ui.editId=null; ui.lastCi=null;
      const c2=ghCfg(); c2.sha=f.sha; ghPut(c2); save(); render();
      ghStatus('Loaded from GitHub at '+new Date().toLocaleString()+'.'); toast('Loaded from GitHub');
    });
    ghStatus('Found the file on GitHub. Confirm to load it.');
  }catch(e){ghStatus(e&&e.status?ghErr(e.status):'Couldn\'t reach GitHub. Check your connection.')}
}
async function ghSave(force){
  const c=ghCfg(); if(!c.repo.trim()){toast('Enter the repository first.');return}
  if(!c.token.trim()){toast('Saving needs an access token.');$('#ghToken')&&$('#ghToken').focus();return}
  ghStatus('Saving to GitHub…');
  try{
    const f=await ghFetchRemote(c), remoteSha=f?f.sha:null;
    if(remoteSha&&remoteSha!==c.sha&&!force){
      confirmBox('The GitHub copy has changed since this device last loaded or saved it. Save anyway and overwrite it?','Overwrite',()=>ghSave(true));
      ghStatus('The GitHub copy has changed. Load it first, or confirm to overwrite.');
      return;
    }
    const body={message:`Update match manager data (${new Date().toISOString().slice(0,16).replace('T',' ')})`,content:b64encode(JSON.stringify(S,null,2)),branch:c.branch.trim()||'main'};
    if(remoteSha)body.sha=remoteSha;
    const r=await fetch(ghUrl(c),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders(c)),body:JSON.stringify(body)});
    if(!r.ok){ghStatus(ghErr(r.status));return}
    const j=await r.json(); const c2=ghCfg(); c2.sha=j.content&&j.content.sha||''; ghPut(c2);
    ghStatus('Saved to GitHub at '+new Date().toLocaleString()+'.'); toast('Saved to GitHub');
  }catch(e){ghStatus(e&&e.status?ghErr(e.status):'Couldn\'t reach GitHub. Check your connection.')}
}

// ───────── match clock ─────────
function clockSec(){
  const m=S.match, H=S.day.halfMins*60;
  const el=m.accum+(m.running?(Date.now()-m.runStart)/1000:0);
  if(m.phase==='pre')return 0; if(m.phase==='h1')return el; if(m.phase==='ht')return H; return H+el;
}
function clockTxt(){
  const s=clockSec(), H=S.day.halfMins*60, ph=S.match.phase;
  if(ph==='h1'&&s>H) return `${S.day.halfMins}+${mmss(s-H)}`;
  if((ph==='h2'||ph==='ft')&&s>2*H) return `${S.day.halfMins*2}+${mmss(s-2*H)}`;
  return mmss(s);
}
function score(){const e=S.match.events;return {us:e.filter(x=>x.type==='goal').length,them:e.filter(x=>x.type==='opp').length}}
function matchInfo(){
  const H=S.day.halfMins*60, ph=S.match.phase, sec=clockSec(), ps=parts();
  let eff=sec; if(ph==='h1')eff=Math.min(sec,H-1); if(ph==='pre')eff=0;
  let ci=0; ps.forEach((p,i)=>{if(p.start*60<=eff)ci=i});
  const ni=ph==='ft'?-1:(ci+1<ps.length?ci+1:-1);
  return {H,ph,sec,eff,ci,ni,ps};
}
function countdownTxt(){
  const {H,ph,eff,ni,ps}=matchInfo(); if(ni<0)return '';
  const t=ps[ni].start*60;
  if(ph==='pre')return `at ${ps[ni].start}'`;
  if(ph==='h1'&&t>=H)return t===H?'at half-time':`${mmss(t-H)} into the 2nd half`;
  return 'in '+mmss(t-eff);
}
function addEvent(type,text,extra,t){S.match.events.push(Object.assign({id:uid(),t:t==null?Math.floor(clockSec()):t,type,text,ph:S.match.phase},extra||{}));save()}
// when a change "actually" happened: now, or N minutes ago (not before the current half started)
function whenT(){
  const now=Math.floor(clockSec()), H=S.day.halfMins*60, ph=S.match.phase;
  const floor=ph==='h1'?0:H;
  return Math.max(floor, now-(ui.subWhen||0)*60);
}
function whenRow(){

}
function startLineup(){
  const m=S.match; if(m.start&&m.start.formation)return m.start;
  const p=parts()[0]; return {formation:p.formation,slots:[...p.slots]};
}
function sortedEvents(){return S.match.events.map((e,i)=>[e,i]).sort((a,b)=>a[0].t-b[0].t||a[1]-b[1]).map(x=>x[0])}
function applyEv(L,e){
  if(e.type==='sub'&&e.slot!=null){L.slots[e.slot]=e.on||null}
  else if(e.type==='swap'&&e.a!=null){const t=L.slots[e.a];L.slots[e.a]=L.slots[e.b];L.slots[e.b]=t}
  else if(e.type==='lineup'&&e.slots){L.formation=e.formation;L.slots=[...e.slots]}

// what is actually on the pitch now (plan + everything logged)
function live(){

}
// actual minutes played, from the log
function actualMinutes(){
  const m=S.match; if(m.phase==='pre')return {};
  const H=S.day.halfMins*60; let now=clockSec(); if(m.phase==='h1')now=Math.min(now,H);
  const st=startLineup(), L={formation:st.formation,slots:[...st.slots]}, secs={}, since={};
  new Set(L.slots.filter(Boolean)).forEach(id=>since[id]=0);
  sortedEvents().forEach(e=>{
    if(e.t>now)return;
    const before=new Set(L.slots.filter(Boolean)); applyEv(L,e); const after=new Set(L.slots.filter(Boolean));
    before.forEach(id=>{if(!after.has(id)){secs[id]=(secs[id]||0)+Math.max(0,Math.min(e.t,H*4)-since[id]);delete since[id]}});
    after.forEach(id=>{if(!before.has(id))since[id]=e.t});
  });
  Object.keys(since).forEach(id=>secs[id]=(secs[id]||0)+Math.max(0,now-since[id]));

}

  });

}
function remap(fromF,fromSlots,toF){
  const a=fset()[fromF]||[], b=fset()[toF]||[], out=Array(b.length).fill(null);
  const pairs=[];
  fromSlots.forEach((id,i)=>{if(!id||!a[i])return;b.forEach((t,j)=>{
    let d=Math.hypot(a[i][1]-t[1],a[i][2]-t[2]); if(a[i][0]===t[0])d-=15; if((a[i][0]==='GK')!==(t[0]==='GK'))d+=500; pairs.push([d,id,j])})});
  pairs.sort((x,y)=>x[0]-y[0]); const used=new Set();
  pairs.forEach(([d,id,j])=>{if(!used.has(id)&&!out[j]){out[j]=id;used.add(id)}});
  return out;
}
function sameLineup(a,b){return a.formation===b.formation&&a.slots.join()===b.slots.join()}

function freezeMatch(){
  const m=S.match; if(!m.archivedId)m.archivedId=uid();
  m.meta={date:S.day.date,opp:S.day.opp,size:S.day.size,halfMins:S.day.halfMins,plan:strat().name,avail:[...S.day.avail]};

function upsertRecord(){
  const m=S.match, meta=m.meta||{}, H=(meta.halfMins||S.day.halfMins)*60;
  const st=startLineup(), secs=actualMinutes(), evs=sortedEvents();
  const end=Math.max(Math.floor(clockSec()),2*H);
  const segs=[]; let f=st.formation, from=0;
  evs.forEach(e=>{if(e.type==='lineup'&&e.formation&&e.formation!==f){if(e.t>from)segs.push({f,from,to:e.t});f=e.formation;from=e.t}});
  segs.push({f,from,to:end});
  const ids=new Set([...st.slots.filter(Boolean),...Object.keys(secs),...(meta.avail||[])]);
  const names={}; ids.forEach(id=>{if(P(id))names[id]=P(id).name});
  const prev=(S.history.find(r=>r.id===m.archivedId)||{}).names||{};
  const rec={id:m.archivedId,date:meta.date,opp:meta.opp||'',size:meta.size,halfMins:meta.halfMins,plan:meta.plan||'',
    avail:meta.avail||[],starters:st.slots.filter(Boolean),secs:Object.fromEntries(Object.entries(secs).map(([k,v])=>[k,Math.round(v)])),
    segs,end,us:evs.filter(e=>e.type==='goal').length,them:evs.filter(e=>e.type==='opp').length,
    goals:evs.filter(e=>e.type==='goal'||e.type==='opp').map(e=>({t:e.t,ph:e.ph||'',us:e.type==='goal',pid:e.pid||null})),
    events:evs.map(e=>({t:e.t,type:e.type,text:e.text})),names:Object.assign({},prev,names)};
  const i=S.history.findIndex(r=>r.id===rec.id);
  if(i>=0)S.history[i]=rec; else S.history.unshift(rec);
  S.history.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function recName(r,id){return (P(id)&&P(id).name)||r.names[id]||'Former player'}
function resultOf(r){return r.us>r.them?'W':r.us<r.them?'L':'D'}
function bandOf(r,g){
  const H=r.halfMins*60; let second=g.ph?(g.ph==='h2'||g.ph==='ft'||g.ph==='ht'):g.t>=H;
  const into=second?Math.max(0,g.t-H):Math.min(g.t,H-1);
  return (second?3:0)+(into<600?0:into<1200?1:2);
}
function seasonStats(){
  const H=S.history, pl={}, forms={}, bands=Array.from({length:6},()=>({f:0,a:0}));
  const touch=id=>pl[id]||(pl[id]={secs:0,games:0,starts:0,avail:0,availSecs:0,goals:0});
  H.forEach(r=>{
    const len=r.end||r.halfMins*120;
    r.avail.forEach(id=>{const p=touch(id);p.avail++;p.availSecs+=len});
    Object.entries(r.secs).forEach(([id,v])=>{const p=touch(id);p.secs+=v;if(v>0)p.games++});
    r.starters.forEach(id=>touch(id).starts++);
    r.goals.forEach(g=>{if(g.us&&g.pid)touch(g.pid).goals++;const b=bandOf(r,g);g.us?bands[b].f++:bands[b].a++});
    r.segs.forEach(sg=>{const k=r.size+'-a-side '+sg.f, F=forms[k]||(forms[k]={f:sg.f,size:r.size,secs:0,gf:0,ga:0,games:new Set()});
      F.secs+=sg.to-sg.from;F.games.add(r.id);
      r.goals.forEach(g=>{if(g.t>=sg.from&&(g.t<sg.to||sg===r.segs[r.segs.length-1]))g.us?F.gf++:F.ga++})});
  });
  return {pl,forms:Object.values(forms).sort((a,b)=>b.secs-a.secs),bands};
}

function seasonCSV(){

async function download(filename,data){
  if(!DL){
    try{const url=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.json')?'application/json':filename.endsWith('.csv')?'text/csv':'text/markdown'}));
      const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
    catch(e){toast('Download failed on this device.')}
    return;
  }
  try{await DL.save({filename,data})}catch(e){if(e&&e.code==='declined')return;toast('Download failed. Try again in a moment.')}
}
function planMarkdown(){

  ps.forEach((p,i)=>{
    t+=`\n## ${p.label} (${partRange(i)}), ${p.formation}\n\n`;
    slotsOf(p).forEach((sl,k)=>{t+=`- ${sl[0]}: ${p.slots[k]?nm(p.slots[k]):'(empty)'}\n`});
    if(i>0){const ch=changes(ps[i-1],p);if(ch.length){t+=`\nChanges:\n`;ch.forEach(c=>t+=`- ${c.text}\n`)}}
    if(p.note)t+=`\nInstructions: ${p.note}\n`;
  });
  if(s.jobs.length){t+=`\n## Jobs and checks\n\n`;s.jobs.forEach(j=>t+=`- [ ] ${j.text}${j.pid&&P(j.pid)?` (${nm(j.pid)})`:''}, ${partName(j.part)}\n`)}
  if(s.notes)t+=`\n## Notes\n\n${s.notes}\n`;
  t+=`\n## Planned minutes\n\n`;
  S.roster.filter(p=>isAvail(p.id)||mins[p.id]).forEach(p=>t+=`- ${p.name}: ${mins[p.id]||0}'\n`);
  return t;
}

// ───────── actions ─────────
const A={
  nav(b){ui.tab=b.dataset.tab;ui.sel=null;ui.editId=null;ui.shape=null;render();window.scrollTo(0,0)},
  avail(b){const id=b.dataset.id,a=S.day.avail;const k=a.indexOf(id);k>=0?a.splice(k,1):a.push(id);save();render()},
  allin(){S.day.avail=S.roster.map(p=>p.id);save();render()},
  allout(){S.day.avail=[];save();render()},
  editp(b){ui.editId=b.dataset.id;render()},
  savep(b){const r=b.closest('.srow'),p=P(b.dataset.id);const n=r.querySelector('[data-k=ename]').value.trim();if(n)p.name=n;p.num=r.querySelector('[data-k=enum]').value.trim();ui.editId=null;save();render()},
  delp(b){const id=b.dataset.id;confirmBox(`Remove ${nm(id)} from the squad?`,'Remove',()=>{
    S.roster=S.roster.filter(p=>p.id!==id);S.day.avail=S.day.avail.filter(x=>x!==id);
    S.strategies.forEach(s=>{s.periods.forEach(p=>p.slots=p.slots.map(x=>x===id?null:x));s.jobs.forEach(j=>{if(j.pid===id)j.pid=''})});
    ui.editId=null;save();render()})},
  addp(){const n=$('#addName').value.trim();if(!n){$('#addName').focus();return}const id=uid();S.roster.push({id,name:n,num:$('#addNum').value.trim()});S.day.avail.push(id);save();render();$('#addName').focus()},
  part(b){ui.partId=b.dataset.id;ui.sel=null;ui.shape=null;render()},
  slot(b){
    const i=+b.dataset.i, per=curPer(), sel=ui.sel;
    if(sel&&sel.type==='player'){per.slots=per.slots.map(x=>x===sel.id?null:x);per.slots[i]=sel.id;ui.sel=null;save()}
    else if(sel&&sel.type==='slot'){if(sel.idx!==i){const t=per.slots[i];per.slots[i]=per.slots[sel.idx];per.slots[sel.idx]=t;save()}ui.sel=null}
    else ui.sel={type:'slot',idx:i};
    render();
  },
  bench(b){
    const id=b.dataset.id, per=curPer(), sel=ui.sel;
    if(sel&&sel.type==='slot'){per.slots[sel.idx]=id;ui.sel=null;save()}
    else if(sel&&sel.type==='player'&&sel.id===id)ui.sel=null;
    else ui.sel={type:'player',id};
    render();
  },
  tobench(){const per=curPer();if(ui.sel&&ui.sel.type==='slot'){per.slots[ui.sel.idx]=null;ui.sel=null;save();render()}},
  addpart(){
    const ps=parts(), per=curPer(), i=ps.indexOf(per), end=partEnd(i), ft=fullTime();
    let sug=end-per.start>=2?Math.round((per.start+end)/2):Math.min(ft-1,end+5);
    ask(`New part starts at minute (1–${ft-1})`,String(sug),v=>{
      const st=parseInt(v);
      if(!(st>=1&&st<ft)){toast(`Pick a minute between 1 and ${ft-1}.`);return}
      if(ps.some(p=>p.start===st)){toast('Another part already starts then.');return}
      const prev=[...ps].reverse().find(p=>p.start<st)||ps[0];
      const np={id:uid(),label:'Part '+(ps.length+1),start:st,formation:prev.formation,slots:[...prev.slots],note:''};
      strat().periods.push(np); parts(); ui.partId=np.id; ui.sel=null; save(); render(); toast(`${np.label} added at ${st}'`);
    },'Add');
    setTimeout(()=>{const x=$('#sheetIn');if(x){x.setAttribute('inputmode','numeric')}},40);
  },
  delpart(){const per=curPer();confirmBox(`Delete ${per.label}?`,'Delete',()=>{const s=strat();s.periods=s.periods.filter(p=>p!==per);if(s.periods[0])s.periods[0].start=0;s.jobs.forEach(j=>{if(j.part===per.id)j.part='all'});ui.partId=null;ui.sel=null;save();render()})},
  copyprev(){const ps=parts(),i=ps.indexOf(curPer());if(i<1)return;const per=ps[i];per.formation=ps[i-1].formation;per.slots=[...ps[i-1].slots];ui.sel=null;save();render()},
  clearpart(){const per=curPer();per.slots=per.slots.map(()=>null);ui.sel=null;save();render()},
  newstrat(){ask('Name the new plan','Plan '+String.fromCharCode(65+S.strategies.length),v=>{const s={id:uid(),name:v||'New plan',periods:newPeriods(S.day.halfMins),jobs:[],notes:''};S.strategies.push(s);S.activeId=s.id;ui.partId=null;save();render()},'Create')},
  dupstrat(){const src=strat();ask('Name the copy',src.name+' (copy)',v=>{const s=JSON.parse(JSON.stringify(src));s.id=uid();s.name=v||src.name+' (copy)';const map={};s.periods.forEach(p=>{const n=uid();map[p.id]=n;p.id=n});s.jobs.forEach(j=>{j.id=uid();j.part=map[j.part]||'all'});S.strategies.push(s);S.activeId=s.id;ui.partId=null;save();render()},'Create')},
  renstrat(){const s=strat();ask('Rename plan',s.name,v=>{if(v){s.name=v;save();render()}})},
  delstrat(){const s=strat();confirmBox(`Delete the plan "${s.name}"?`,'Delete',()=>{S.strategies=S.strategies.filter(x=>x!==s);S.activeId=S.strategies[0].id;ui.partId=null;save();render()})},
  tpl(b){const i=$('#jobText');i.value=b.dataset.v;i.focus()},
  addjob(){const t=$('#jobText').value.trim();if(!t){$('#jobText').focus();return}strat().jobs.push({id:uid(),text:t,pid:$('#jobWho').value,part:$('#jobPart').value,done:false});save();render()},
  jobdone(b){const j=strat().jobs.find(x=>x.id===b.dataset.id);if(j){j.done=!j.done;save();render()}},
  jobdel(b){const s=strat();s.jobs=s.jobs.filter(x=>x.id!==b.dataset.id);save();render()},
  jobsreset(){strat().jobs.forEach(j=>j.done=false);save();render()},
  start1(){const m=S.match;const p0=parts()[0];m.start={formation:p0.formation,slots:[...p0.slots]};m.phase='h1';m.accum=0;m.running=true;m.runStart=Date.now();addEvent('phase','Kick-off');ui.lastCi=0;render()},
  pause(){const m=S.match;m.accum+=(Date.now()-m.runStart)/1000;m.running=false;save();render()},
  resume(){const m=S.match;m.running=true;m.runStart=Date.now();save();render()},
  ht(){const m=S.match;addEvent('phase','Half-time');m.phase='ht';m.running=false;m.accum=0;save();render()},
  start2(){const m=S.match;m.phase='h2';m.accum=0;m.running=true;m.runStart=Date.now();addEvent('phase','Second half kick-off');render()},
  ft(){const m=S.match;if(m.running)m.accum+=(Date.now()-m.runStart)/1000;m.running=false;addEvent('phase','Full time');m.phase='ft';freezeMatch();save();render();toast('Added to the season')},
  reset(){const live2=['h1','ht','h2'].includes(S.match.phase);confirmBox(live2?'Clear the clock, score and log? This match hasn\'t reached full time, so it won\'t be added to the season.':'Start a new match? This one is already saved in the Season tab.',live2?'Clear':'New match',()=>{S.match=freshMatch();ui.lastCi=null;save();render()})},
  goal(){
    const on=live().slots.filter(Boolean);
    pick('Who scored?',[...on.map(id=>({v:id,t:nm(id)})),{v:'',t:'Not sure'}],v=>{addEvent('goal',v?`Goal, ${nm(v)}`:'Goal',{pid:v||null});render()});
  },
  oppgoal(){addEvent('opp',`Goal for ${S.day.opp||'them'}`);render()},
  addnote(){const i=$('#evNote'),t=i.value.trim();if(!t){i.focus();return}addEvent('note',t);render()},
  evdel(b){S.match.events=S.match.events.filter(e=>e.id!==b.dataset.id);save();render()},
  when(b){ui.subWhen=+b.dataset.v;document.querySelectorAll('[data-act=when]').forEach(x=>{const on=+x.dataset.v===ui.subWhen;x.classList.toggle('sel',on);x.setAttribute('aria-pressed',on)})},
  applyplan(b){
    const per=parts().find(p=>p.id===b.dataset.id); if(!per)return;
    const ch=changes(live(),per);
    addEvent('lineup',`${per.label}: `+ch.map(c=>c.text).join('; '),{formation:per.formation,slots:[...per.slots]},whenT());
    S.match.acked.push(per.id); ui.subWhen=0; save(); render();
  },
  keepcur(b){S.match.acked.push(b.dataset.id);addEvent('note','Kept the current team instead of the planned changes');ui.subWhen=0;render()},
  lslot(b){
    const i=+b.dataset.i, L=live(), sl=slotsOf(L), id=L.slots[i], pos=sl[i][0];
    const onP=new Set(L.slots.filter(Boolean));
    const bench=S.roster.filter(p=>isAvail(p.id)&&!onP.has(p.id));
    const others=L.slots.map((x,j)=>[x,j]).filter(([x,j])=>x&&j!==i);
    ui.subWhen=0;
    sheet(id?`${nm(id)} (${pos})`:`Empty position (${pos})`,`
      ${whenRow()}
      <div class="sheet-sec">${id?'Bring on':'Put on'}</div>
      ${bench.length?`<div class="opts">${bench.map(p=>`<button class="chip" data-act="lsub" data-slot="${i}" data-id="${p.id}">${esc(p.name)}</button>`).join('')}</div>`:'<p class="none">No one on the bench.</p>'}
      ${id?`<div class="sheet-sec">Or swap positions with</div><div class="opts">${others.map(([x,j])=>`<button class="chip" data-act="lswap" data-a="${i}" data-b="${j}">${esc(nm(x))} <span class="n">${esc(sl[j][0])}</span></button>`).join('')}</div>
      <div class="row"><button class="btn warn" data-act="loff" data-slot="${i}">Off, no replacement</button><button class="btn" data-act="sheetclose">Cancel</button></div>`
      :`<div class="row"><button class="btn" data-act="sheetclose">Cancel</button></div>`}`,null);
  },
  lbench(b){
    const on=b.dataset.id, L=live(), sl=slotsOf(L);
    ui.subWhen=0;
    sheet(`Bring on ${nm(on)}`,`
      ${whenRow()}
      <div class="sheet-sec">In place of</div>
      <div class="opts">${L.slots.map((x,j)=>[x,j]).filter(([x])=>x).map(([x,j])=>`<button class="chip" data-act="lsub" data-slot="${j}" data-id="${on}">${esc(nm(x))} <span class="n">${esc(sl[j][0])}</span></button>`).join('')}
      ${L.slots.map((x,j)=>[x,j]).filter(([x])=>!x).map(([x,j])=>`<button class="chip" data-act="lsub" data-slot="${j}" data-id="${on}">Empty <span class="n">${esc(sl[j][0])}</span></button>`).join('')}</div>
      <div class="row"><button class="btn" data-act="sheetclose">Cancel</button></div>`,null);
  },
  lsub(b){
    const i=+b.dataset.slot, on=b.dataset.id, L=live(), off=L.slots[i], pos=slotsOf(L)[i][0];
    addEvent('sub',off?`${nm(on)} on for ${nm(off)} (${pos})`:`${nm(on)} on (${pos})`,{slot:i,on,off:off||null},whenT());
    closeSheet(); ui.subWhen=0; render(); toast('Sub logged');
  },
  lswap(b){
    const a=+b.dataset.a, c=+b.dataset.b, L=live(), sl=slotsOf(L);
    addEvent('swap',`${nm(L.slots[a])} to ${sl[c][0]}, ${nm(L.slots[c])} to ${sl[a][0]}`,{a,b:c},whenT());
    closeSheet(); ui.subWhen=0; render(); toast('Swap logged');
  },
  loff(b){
    const i=+b.dataset.slot, L=live(), off=L.slots[i];
    addEvent('sub',`${nm(off)} off, no replacement`,{slot:i,on:null,off},whenT());
    closeSheet(); ui.subWhen=0; render();
  },
  dljson(){download(`match-${S.day.date}${S.day.opp?'-'+S.day.opp.replace(/[^\w-]+/g,'-'):''}.json`,JSON.stringify(S,null,2))},
  ghsave(){ghSave(false)},
  ghload(){ghLoad()},
  async ghlink(){
    const c=ghCfg(); if(!c.repo.trim()||!c.token.trim()){toast('Fill in the repository and token first.');return}
    const url=ghSetupLink();
    try{await navigator.clipboard.writeText(url);toast('Setup link copied')}
    catch(e){sheet('Copy this setup link',`<textarea class="in" id="sheetIn" readonly style="min-height:120px">${esc(url)}</textarea><div class="row" style="margin-top:12px"><button class="btn" data-act="sheetclose">Done</button></div>`,null);setTimeout(()=>{const t=$('#sheetIn');if(t){t.focus();t.select()}},30)}
  },
  exportall(){const d=new Date().toISOString().slice(0,10);download(`match-manager-backup-${d}.json`,JSON.stringify(S,null,2));toast('Backup exported')},
  importpick(){const f=$('#importFile');f.value='';f.click()},
  dlmd(){download(`${strat().name.replace(/[^\w-]+/g,'-')}.md`,planMarkdown())},
  shapeedit(){ui.shape={layout:JSON.parse(JSON.stringify(slotsOf(curPer())))};ui.sel=null;render()},
  shapecancel(){ui.shape=null;render()},
  shapesaveas(){
    const base=curPer().formation;
    ask('Name your formation',base+' (mine)',v=>{
      if(!v)return; if(fset()[v]){toast('That name is already used. Pick another.');return}
      (S.custom[S.day.size]=S.custom[S.day.size]||{})[v]=ui.shape.layout;
      curPer().formation=v; ui.shape=null; save(); render(); toast(`Saved ${v}`);
    },'Save');
  },
  shapeupdate(){const f=curPer().formation;S.custom[S.day.size][f]=ui.shape.layout;ui.shape=null;save();render();toast(`Updated ${f}`)},
  shapedel(){const f=curPer().formation;confirmBox(`Delete the formation ${f}? Parts using it switch to a standard shape.`,'Delete',()=>{delete S.custom[S.day.size][f];S.strategies.forEach(s=>s.periods.forEach(fixPeriod));ui.shape=null;save();render()})},
  toboard(b){const ps=parts();const per=(b.dataset.id&&ps.find(p=>p.id===b.dataset.id))||curPer();if(!S.board)S.board={tokens:[],lines:[],from:''};ui.boardSrc=per.id;loadBoard(per);save();ui.tab='board';ui.shape=null;render();window.scrollTo(0,0)},
  bload(){const per=parts().find(p=>p.id===$('#bSrc').value);if(!per)return;ui.boardSrc=per.id;loadBoard(per);save();renderBoard()},
  btool(b){ui.tool=b.dataset.v;renderBoard()},
  bcolor(b){ui.color=b.dataset.v;renderBoard()},
  bundo(){S.board.lines.pop();save();renderBoard()},
  bclear(){S.board.lines=[];save();renderBoard()},
  bopp1(){const n=S.board.tokens.filter(t=>t.kind==='opp').length+1;S.board.tokens.push({id:uid(),kind:'opp',label:String(n),name:'',x:+(20+Math.random()*28).toFixed(1),y:+(35+Math.random()*10).toFixed(1)});save();renderBoard()},
  boppteam(){
    const per=parts().find(p=>p.id===ui.boardSrc)||curPer();
    pick('Their shape',Object.keys(fset()).map(f=>({v:f,t:f})),f=>{
      const B=S.board; B.tokens=B.tokens.filter(t=>t.kind!=='opp');
      (fset()[f]||slotsOf(per)).forEach((sl,i)=>B.tokens.push({id:uid(),kind:'opp',label:String(i+1),name:'',x:+(68-sl[1]*.68).toFixed(1),y:100-sl[2]}));
      save();renderBoard();
    });
  },
  bball(){const B=S.board,b=B.tokens.find(t=>t.kind==='ball');if(b){b.x=34;b.y=50}else B.tokens.push({id:uid(),kind:'ball',label:'',name:'',x:34,y:50});save();renderBoard()},
  bwipe(){confirmBox('Clear everything off the board?','Clear',()=>{S.board={tokens:[],lines:[],from:''};save();renderBoard()})},
  bsave(){ask('Name this board',S.board.from||'Board',v=>{S.boards.unshift({id:uid(),name:v||'Board',savedAt:Date.now(),from:S.board.from||'',tokens:JSON.parse(JSON.stringify(S.board.tokens)),lines:JSON.parse(JSON.stringify(S.board.lines))});S.boards=S.boards.slice(0,40);save();renderBoard();toast('Board saved')},'Save')},
  bopen(b){const x=S.boards.find(y=>y.id===b.dataset.id);if(!x)return;S.board={tokens:JSON.parse(JSON.stringify(x.tokens)),lines:JSON.parse(JSON.stringify(x.lines)),from:x.name};save();renderBoard();window.scrollTo(0,0);toast(`Opened ${x.name}`)},
  bdel(b){const x=S.boards.find(y=>y.id===b.dataset.id);if(!x)return;confirmBox(`Delete the saved board "${x.name}"?`,'Delete',()=>{S.boards=S.boards.filter(y=>y!==x);save();renderBoard()})},
  game(b){const r=S.history.find(x=>x.id===b.dataset.id);if(r)gameSheet(r)},
  gamedel(b){const r=S.history.find(x=>x.id===b.dataset.id);if(!r)return;confirmBox(`Delete the match ${r.opp?'vs '+r.opp:''} on ${r.date} from the season?`,'Delete',()=>{S.history=S.history.filter(x=>x!==r);if(S.match.archivedId===r.id){S.match.archivedId=null}save();render()})},
  dlseason(){download(`season-${today()}.csv`,seasonCSV())},
  sheetpick(b){const cb=ui.sheetCb;closeSheet();cb&&cb(b.dataset.v)},
  sheetok(){const i=$('#sheetIn'),cb=ui.sheetCb,v=i?i.value.trim():true;closeSheet();cb&&cb(v)},
  sheetclose(){closeSheet()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(f)f(b)});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const id=e.target.id;
  if(id==='addName')A.addp(); else if(id==='jobText')A.addjob(); else if(id==='evNote')A.addnote(); else if(id==='sheetIn')A.sheetok();
});
function field(el,commit){
  const f=el.dataset.field,v=el.value;
  switch(f){
    case 'opp':S.day.opp=v;save();renderTop();break;
    case 'date':S.day.date=v;save();break;
    case 'half':if(commit){S.day.halfMins=Math.max(5,Math.min(60,parseInt(v)||35));save();render()}break;
    case 'size':ui.shape=null;S.day.size=+v;S.strategies.forEach(s=>s.periods.forEach(fixPeriod));ui.sel=null;save();render();break;
    case 'active':S.activeId=v;ui.partId=null;ui.sel=null;save();render();break;
    case 'plabel':curPer().label=v;save();if(commit)render();break;
    case 'pstart':if(commit){const per=curPer();let st=Math.max(1,Math.min(fullTime()-1,parseInt(v)||0));if(strat().periods.some(p=>p!==per&&p.start===st)){toast('Another part already starts then.');render();break}per.start=st;save();render()}break;
    case 'pform':if(commit){const per=curPer();per.formation=v;fixPeriod(per);ui.sel=null;save();render()}break;
    case 'pnote':curPer().note=v;save();break;
    case 'lform':if(commit){const L=live();if(v===L.formation)break;const ns=remap(L.formation,L.slots,v);
      addEvent('lineup',`Shape changed to ${v}`,{formation:v,slots:ns});render();toast(`Now playing ${v}`)}break;
    case 'snotes':strat().notes=v;save();break;
  }
}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.field)field(e.target,false)});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.field)field(e.target,true)});
$('#sheet').addEventListener('close',()=>{ui.sheetCb=null});
document.addEventListener('change',e=>{
  if(e.target.id!=='importFile'||!e.target.files||!e.target.files[0])return;
  const file=e.target.files[0], r=new FileReader();
  r.onload=()=>{
    let d; try{d=JSON.parse(r.result)}catch(err){toast('That file isn\'t a Match Manager backup.');return}
    if(!d||d.v!==2||!Array.isArray(d.roster)||!Array.isArray(d.strategies)){toast('That file isn\'t a Match Manager backup.');return}
    const np=d.strategies.length, nr=d.roster.length;
    confirmBox(`Replace everything here with this backup (${nr} players, ${np} plan${np===1?'':'s'})?`,'Import',()=>{
      S=normalise(d); ui.partId=null; ui.sel=null; ui.editId=null; ui.lastCi=null; save(); render(); toast('Backup imported');
    });
  };
  r.onerror=()=>toast('Could not read that file.');
  r.readAsText(file);
});

// ───────── boot ─────────
ghFromHash();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
S=normalise(loadLocal()||defaultState());
if(S.match.phase==='ft'&&!S.match.archivedId){try{freezeMatch();upsertRecord()}catch(e){}}
if(!S.roster.length&&S.updatedAt===0)ui.tab='squad';
if(!window.claude||!window.claude.use)document.body.classList.add('dl-on');
render();
(async()=>{
  if(!window.claude||!window.claude.use)return;
  try{DL=await window.claude.use('downloads');if(DL)document.body.classList.add('dl-on')}catch(e){}
})();
(async()=>{
  if(!window.claude||!window.claude.use)return;
  try{
    DB=await window.claude.use('db'); if(!DB)return;
    const snap=await DB.doc(DOC).get();
    if(snap.exists){
      const d=JSON.parse(JSON.stringify(snap.data()));
      if(d&&d.v===2&&(d.updatedAt||0)>(S.updatedAt||0)){S=normalise(d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}ui.partId=null;render()}
      else if((S.updatedAt||0)>(d.updatedAt||0))pushDb();
    } else if(S.updatedAt)pushDb();
  }catch(e){}
})();
